<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Menu - RestoranKu</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C2531F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #C2531F; --primary-dark: #7C3712; --primary-light: #FBEEE6;
  --success: #2F855A; --danger: #C53030; --bg: #F6F4F0;
  --card: #fff; --border: #E7E5E1; --text: #21262F; --muted: #767D8A;
  --shadow: 0 1px 2px rgba(23,20,15,.05), 0 6px 18px rgba(23,20,15,.06);
}
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px; }

/* ============================================
   HEADER — didesain ulang: dulu cuma blok warna
   flat + teks, terlihat generik/template. Sekarang
   ada lapisan gradasi bertekstur, garis lengkung
   custom di bagian bawah, dan "kartu identitas"
   restoran yang melayang menumpuk di atas lengkungan
   (bukan cuma logo kotak nempel biasa).
   ============================================ */
.resto-header { background: linear-gradient(150deg, var(--primary-dark) 0%, var(--primary) 65%, #D9682F 100%); color: white; padding: 22px 18px 0; position: relative; overflow: hidden; }
.resto-header::before { content:''; position:absolute; inset:0; background-image: radial-gradient(rgba(255,255,255,.14) 1px, transparent 1px); background-size: 14px 14px; opacity:.55; pointer-events:none; }
.resto-header::after { content:''; position:absolute; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,.08); top:-90px; right:-60px; pointer-events:none; }
.resto-topline { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:600; letter-spacing:.03em; color:rgba(255,255,255,.85); padding-bottom:14px; }
.resto-topline .brand-mark { display:flex; align-items:center; gap:6px; }
.resto-topline .brand-mark svg { width:14px; height:14px; opacity:.9; }
.resto-wave { position:relative; z-index:2; display:block; width:100%; height:34px; margin-bottom:-1px; }
.resto-wave path { fill: var(--bg); }

.resto-card { position:relative; z-index:3; background:#fff; border-radius:20px; margin: -46px 4px 18px; padding:18px 16px 16px; box-shadow: 0 14px 30px rgba(45,25,10,.16), 0 2px 8px rgba(45,25,10,.06); display:flex; gap:14px; align-items:flex-start; }
.resto-logo { width: 62px; height: 62px; border-radius: 16px; background: var(--primary-light); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow:hidden; flex-shrink:0; box-shadow: 0 4px 10px rgba(194,83,31,.18); }
.resto-logo svg { width: 26px; height: 26px; color: var(--primary); }
.resto-logo img { width:62px; height:62px; object-fit:cover; border-radius:16px; }
.resto-card-body { flex:1; min-width:0; }
.resto-name { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; line-height:1.15; margin-bottom: 7px; color: var(--text); }
.resto-meta { font-size: 12.5px; display: flex; align-items: center; gap: 8px; flex-wrap:wrap; }
.meja-badge { background: var(--primary-light); color: var(--primary-dark); padding: 4px 11px; border-radius: 999px; font-weight: 700; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; }
.status-open { background: #E7F6EC; color: #1F7A46; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; }
.status-closed { background: #FBEAEA; color: #B33; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.status-dot.green { background: #2F855A; }
.status-dot.red { background: #C53030; }
.resto-hours { color: var(--muted); display:inline-flex; align-items:center; gap:4px; }

/* CATEGORY TABS — dulu daftar emoji + teks mengambang dengan garis bawah
   polos. Sekarang jadi pill custom dengan ikon dibungkus lencana bulat kecil
   supaya tidak terlihat "penuh emoji", lebih seperti chip terkurasi. */
.cat-tabs { background: var(--bg); padding: 4px 14px 12px; display: flex; gap: 8px; overflow-x: auto; position: sticky; top: 0; z-index: 100; }
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab { padding: 8px 14px 8px 8px; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; color: var(--text); transition: all 0.2s; flex-shrink: 0; display: flex; align-items: center; gap: 7px; background: #fff; border: 1px solid var(--border); border-radius: 999px; }
.cat-tab .cat-badge { width: 22px; height: 22px; border-radius: 50%; background: var(--primary-light); display:inline-flex; align-items:center; justify-content:center; font-size: 12px; flex-shrink:0; }
.cat-tab.active { color: #fff; background: var(--primary); border-color: var(--primary); box-shadow: 0 5px 12px rgba(194,83,31,.28); }
.cat-tab.active .cat-badge { background: rgba(255,255,255,.22); }

/* SEARCH */
.search-wrap { padding: 4px 16px 14px; background: var(--bg); }
.search-input { width: 100%; padding: 12px 16px 12px 42px; border: 1px solid var(--border); border-radius: 14px; font-size: 14px; font-family: inherit; background: #fff; box-shadow: 0 1px 2px rgba(23,20,15,.04); }
.search-input:focus { outline: none; border-color: var(--primary); }
.search-wrap-inner { position: relative; }
.search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; }

/* MENU SECTION */
.menu-section { padding: 4px 16px 16px; }
.section-title { font-size: 15.5px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 9px; font-family:'Fraunces', serif; }
.section-title .sec-badge { width: 26px; height: 26px; border-radius: 9px; background: var(--primary-light); display:inline-flex; align-items:center; justify-content:center; font-size: 13px; flex-shrink:0; }

/* MENU ITEM */
.menu-item { background: white; border-radius: 14px; margin-bottom: 12px; overflow: hidden; border: 1px solid var(--border); display: flex; box-shadow: var(--shadow); transition: transform 0.15s; }
.menu-item:active { transform: scale(0.98); }
.menu-item.habis { opacity: 0.55; }
.menu-img { width: 110px; min-height: 110px; background: var(--bg); color: var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.menu-img svg { width: 34px; height: 34px; }
.menu-img img { width: 110px; min-height: 110px; object-fit: cover; }
.menu-body { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; min-height: 110px; }
.menu-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
.menu-desc { font-size: 12px; color: var(--muted); margin-bottom: 8px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.menu-footer { display: flex; align-items: center; justify-content: space-between; }
.menu-price { font-size: 16px; font-weight: 800; color: var(--primary); }
.habis-label { font-size: 12px; font-weight: 600; color: var(--danger); background: #FFF5F5; padding: 4px 10px; border-radius: 999px; }
.rec-badge { font-size: 10px; background: #FBF4E0; color: #9C6B18; padding: 2px 7px; border-radius: 999px; font-weight: 700; margin-bottom: 4px; display: inline-flex; align-items: center; gap: 3px; }

/* QTY CONTROL */
.qty-ctrl { display: flex; align-items: center; gap: 8px; }
.qty-btn { width: 30px; height: 30px; border-radius: 50%; border: none; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.qty-btn.minus { background: #EDF2F7; color: var(--text); }
.qty-btn.plus { background: var(--primary); color: white; }
.qty-btn:active { transform: scale(0.9); }
.qty-num { font-size: 15px; font-weight: 700; min-width: 20px; text-align: center; }

/* CART BUTTON (sticky bottom) */
.cart-btn-wrap { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; background: white; border-top: 1px solid var(--border); z-index: 200; }
.cart-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-family: inherit; transition: all 0.2s; }
.cart-btn:active { background: var(--primary-dark); transform: scale(0.99); }
.cart-btn-left { display: flex; align-items: center; gap: 10px; }
.cart-count { background: rgba(255,255,255,0.3); border-radius: 999px; padding: 2px 10px; font-size: 14px; }

/* MODAL CART */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; display: flex; align-items: flex-end; opacity: 0; visibility: hidden; transition: all 0.3s; }
.modal-overlay.active { opacity: 1; visibility: visible; }
.sheet { background: white; border-radius: 20px 20px 0 0; width: 100%; max-height: 90vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s; }
.modal-overlay.active .sheet { transform: translateY(0); }
.sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
.sheet-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.sheet-header h3 { font-size: 18px; }
.sheet-close { width: 32px; height: 32px; border: none; background: var(--bg); border-radius: 50%; font-size: 16px; cursor: pointer; }
.sheet-body { padding: 16px 20px; }

/* CART ITEM */
.cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.cart-item:last-child { border-bottom: none; }
.cart-item-info { flex: 1; }
.cart-item-name { font-weight: 600; font-size: 14px; }
.cart-item-price { font-size: 13px; color: var(--muted); margin-top: 2px; }
.cart-item-total { font-weight: 700; color: var(--primary); font-size: 14px; }

/* SUMMARY */
.order-summary { background: var(--bg); border-radius: 12px; padding: 14px; margin: 16px 0; }
.summary-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
.summary-row.total { font-weight: 700; font-size: 16px; padding-top: 10px; border-top: 1px solid var(--border); margin-top: 6px; color: var(--primary); }

/* FORM ORDER */
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.form-control { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; }
.form-control:focus { outline: none; border-color: var(--primary); }

/* PAYMENT RESULT */
.result-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 40px 20px; text-align: center; background: var(--bg); }
.result-icon { width: 84px; height: 84px; border-radius: 50%; background: var(--bg); color: var(--muted); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
.result-icon svg { width: 36px; height: 36px; }
.result-title { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
.result-sub { color: var(--muted); font-size: 15px; margin-bottom: 28px; line-height: 1.6; }

/* LOADING */
.loading { display: flex; align-items: center; justify-content: center; min-height: 200px; flex-direction: column; gap: 12px; }
.spinner-lg { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* EMPTY */
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty .icon { width: 60px; height: 60px; border-radius: 50%; background: white; color: var(--muted); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
.empty .icon svg { width: 26px; height: 26px; }
</style>
</head>
<body>

<div id="app">
  <div class="loading"><div class="spinner-lg"></div><p style="color:var(--muted)">Memuat menu...</p></div>
</div>

<!-- MODAL DETAIL MENU -->
<div class="modal-overlay" id="modal-detail">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5"/><path d="M12 8h.01"/></svg> Detail Menu</h3>
      <button class="sheet-close" onclick="closeDetail()"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="detail-body"></div>
  </div>
</div>

<!-- MODAL CART -->
<div class="modal-overlay" id="modal-cart">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/><path d="M2.5 3h2l2.3 12a2 2 0 0 0 2 1.6h8a2 2 0 0 0 2-1.6L21 8H6.2"/></svg> Keranjang Pesanan</h3>
      <button class="sheet-close" onclick="closeCart()"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="cart-body"></div>
  </div>
</div>

<!-- MODAL PEMBAYARAN BERHASIL -->
<div class="modal-overlay" id="modal-success">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-body" style="text-align:center;padding:40px 24px">
      <div style="width:76px;height:76px;border-radius:50%;background:var(--success);opacity:.12;position:absolute"></div><div style="width:76px;height:76px;border-radius:50%;background:transparent;color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 16px"><svg class="i" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.3 12.5l2.5 2.5L16 9.5"/></svg></div>
      <h2 style="font-size:22px;margin-bottom:8px">Pembayaran Berhasil!</h2>
      <p style="color:var(--muted);margin-bottom:8px" id="success-order-num"></p>
      <p style="color:var(--muted);margin-bottom:24px">Pesananmu sedang diproses oleh dapur. Terima kasih!</p>
      <div style="background:var(--bg);border-radius:12px;padding:16px;margin-bottom:20px;text-align:left" id="success-detail"></div>
      <button onclick="resetOrder()" style="width:100%;padding:14px;background:var(--primary);color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">Pesan Lagi</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://rjxhijozmznqvkxqbywr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_v-FyoWoz05KpYt1gA1k96A_IZiQnpXB';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// Parse URL params
const params = new URLSearchParams(window.location.search);
const restoSlug = params.get('resto');
const mejaNum = parseInt(params.get('meja') || '1');

const PLATFORM_FEE = 950; // fee tetap per transaksi, ditanggung konsumen atau restoran sesuai pengaturan resto
let restoData = null, menuItems = [], categories = [], cart = {}, activeCat = 'all';

function formatRp(n) { return new Intl.NumberFormat('id-ID', { style:'currency', currency:'IDR', minimumFractionDigits:0 }).format(n); }

async function init() {
  if (!restoSlug) { showError('QR Code tidak valid. Silakan scan ulang.'); return; }

  const { data: resto } = await db.from('restaurants').select('*').eq('slug', restoSlug).single();
  if (!resto) { showError('Restoran tidak ditemukan.'); return; }
  restoData = resto;

  const [{ data: cats }, { data: menus }] = await Promise.all([
    db.from('menu_categories').select('*').eq('restaurant_id', resto.id).eq('is_active', true).order('sort_order'),
    db.from('menu_items').select('*').eq('restaurant_id', resto.id).order('sort_order').order('name')
  ]);

  categories = cats || [];
  menuItems = menus || [];
  renderPage();
}

function showError(msg) {
  document.getElementById('app').innerHTML = `<div class="result-page"><div class="result-icon"><svg class="i" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></div><div class="result-title">Oops!</div><div class="result-sub">${msg}</div></div>`;
}

function renderPage() {
  const isOpen = restoData.is_open;
  const filtered = activeCat === 'all' ? menuItems : menuItems.filter(m => m.category_id === activeCat);

  // Group by category
  const grouped = {};
  if (activeCat === 'all') {
    categories.forEach(c => { grouped[c.id] = { name: c.name, icon: c.icon, items: [] }; });
    grouped['_none'] = { name: 'Lainnya', icon: '<svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2.5v6a1.6 1.6 0 0 0 3.2 0v-6"/><path d="M8.6 2.5v18"/><path d="M16.5 2.5c-1.8 0-2.8 2.1-2.8 5s1 4 2 4v9"/></svg>', items: [] };
    menuItems.forEach(m => {
      if (m.category_id && grouped[m.category_id]) grouped[m.category_id].items.push(m);
      else grouped['_none'].items.push(m);
    });
  }

  const searchQuery = document.getElementById('search-q')?.value?.toLowerCase() || '';
  const displayItems = filtered.filter(m => !searchQuery || m.name.toLowerCase().includes(searchQuery) || (m.description||'').toLowerCase().includes(searchQuery));

  const totalItems = Object.values(cart).reduce((s, q) => s + q, 0);
  const totalPrice = Object.entries(cart).reduce((s, [id, q]) => {
    const m = menuItems.find(x => x.id === id); return s + (m ? m.price * q : 0);
  }, 0);

  let html = `
    <div class="resto-header">
      <div class="resto-topline">
        <span class="brand-mark"><svg class="i" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2.5v6a1.6 1.6 0 0 0 3.2 0v-6"/><path d="M8.6 2.5v18"/><path d="M16.5 2.5c-1.8 0-2.8 2.1-2.8 5s1 4 2 4v9"/></svg> Menu Digital</span>
        ${restoData.opening_time ? `<span>${restoData.opening_time.slice(0,5)}&ndash;${(restoData.closing_time||'22:00').slice(0,5)}</span>` : ''}
      </div>
      <svg class="resto-wave" viewBox="0 0 400 34" preserveAspectRatio="none"><path d="M0,34 C80,8 140,30 200,20 C260,10 320,26 400,10 L400,34 Z"></path></svg>
    </div>

    <div class="resto-card">
      <div class="resto-logo">${restoData.logo_url ? `<img src="${restoData.logo_url}" onerror="this.parentElement.innerHTML='<svg class=&quot;i&quot; width=&quot;24&quot; height=&quot;24&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M7 2.5v6a1.6 1.6 0 0 0 3.2 0v-6&quot;/><path d=&quot;M8.6 2.5v18&quot;/><path d=&quot;M16.5 2.5c-1.8 0-2.8 2.1-2.8 5s1 4 2 4v9&quot;/></svg>'">` : `<svg class="i" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2.5v6a1.6 1.6 0 0 0 3.2 0v-6"/><path d="M8.6 2.5v18"/><path d="M16.5 2.5c-1.8 0-2.8 2.1-2.8 5s1 4 2 4v9"/></svg>`}</div>
      <div class="resto-card-body">
        <div class="resto-name">${restoData.name}</div>
        <div class="resto-meta">
          <span class="meja-badge"><svg class="i" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="3" rx="1"/><path d="M5.5 10.5V20"/><path d="M18.5 10.5V20"/></svg> Meja ${mejaNum}</span>
          <span class="${isOpen ? 'status-open' : 'status-closed'}">${isOpen ? '<span class="status-dot green" style="margin-right:5px"></span>Buka' : '<span class="status-dot red" style="margin-right:5px"></span>Tutup'}</span>
        </div>
      </div>
    </div>

    <div class="cat-tabs">
      <div class="cat-tab ${activeCat==='all'?'active':''}" onclick="setCat('all')"><span class="cat-badge">✦</span>Semua</div>
      ${categories.map(c => `<div class="cat-tab ${activeCat===c.id?'active':''}" onclick="setCat('${c.id}')"><span class="cat-badge">${c.icon}</span>${c.name}</div>`).join('')}
    </div>

    <div class="search-wrap">
      <div class="search-wrap-inner">
        <span class="search-icon"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.3" cy="10.3" r="6.3"/><path d="M20 20l-4.3-4.3"/></svg></span>
        <input type="text" class="search-input" id="search-q" placeholder="Cari menu..." value="${searchQuery}" oninput="renderPage()">

    html += `<div class="empty"><div class="icon"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.2v5l3.3 1.9"/></svg></div><p style="font-weight:700;font-size:16px">Restoran sedang tutup</p><p>Silakan kembali pada jam ${(restoData.opening_time||'08:00').slice(0,5)} - ${(restoData.closing_time||'22:00').slice(0,5)}</p></div>`;

    let hasItems = false;
    Object.entries(grouped).forEach(([catId, group]) => {
      const items = group.items.filter(m => !searchQuery || m.name.toLowerCase().includes(searchQuery) || (m.description||'').toLowerCase().includes(searchQuery));
      if (!items.length) return;
      hasItems = true;
      html += `<div class="menu-section"><div class="section-title"><span class="sec-badge">${group.icon}</span>${group.name}</div>`;
      html += items.map(m => menuItemHTML(m)).join('');

    });
    if (!hasItems) html += `<div class="empty"><div class="icon"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.3" cy="10.3" r="6.3"/><path d="M20 20l-4.3-4.3"/></svg></div><p>Menu tidak ditemukan</p></div>`;
  } else {
    if (!displayItems.length) {
      html += `<div class="empty"><div class="icon"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2.5v6a1.6 1.6 0 0 0 3.2 0v-6"/><path d="M8.6 2.5v18"/><path d="M16.5 2.5c-1.8 0-2.8 2.1-2.8 5s1 4 2 4v9"/></svg></div><p>Tidak ada menu di kategori ini</p></div>`;
    } else {
      html += `<div class="menu-section">${displayItems.map(m => menuItemHTML(m)).join('')}</div>`;

  html += `</div>`;

  if (totalItems > 0) {
    html += `<div class="cart-btn-wrap">
      <button class="cart-btn" onclick="openCart()">
        <div class="cart-btn-left"><span class="cart-count">${totalItems}</span><span>Lihat Keranjang</span></div>
        <span>${formatRp(totalPrice)}</span>
      </button>
    </div>`;
  }

  document.getElementById('app').innerHTML = html;
}

function menuItemHTML(m) {
  const isHabis = !m.is_available || m.stock === 0;
  const qty = cart[m.id] || 0;
  return `<div class="menu-item ${isHabis?'habis':''}" onclick="openItemDetail('${m.id}')" style="cursor:pointer">
    <div class="menu-img">${m.image_url ? `<img src="${m.image_url}" loading="lazy" onerror="this.parentElement.innerHTML='<svg class=&quot;i&quot; width=&quot;22&quot; height=&quot;22&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M7 2.5v6a1.6 1.6 0 0 0 3.2 0v-6&quot;/><path d=&quot;M8.6 2.5v18&quot;/><path d=&quot;M16.5 2.5c-1.8 0-2.8 2.1-2.8 5s1 4 2 4v9&quot;/></svg>'">` : `<svg class="i" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2.5v6a1.6 1.6 0 0 0 3.2 0v-6"/><path d="M8.6 2.5v18"/><path d="M16.5 2.5c-1.8 0-2.8 2.1-2.8 5s1 4 2 4v9"/></svg>`}</div>
    <div class="menu-body">
      <div>
        ${m.is_recommended ? `<span class="rec-badge"><svg class="i" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.3l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6-4.4-4.2 6-.8L12 3.3Z"/></svg> Rekomendasi</span>` : ''}
        <div class="menu-title">${m.name}</div>
        ${m.description ? `<div class="menu-desc">${m.description}</div>` : `<div class="menu-desc" style="color:var(--muted);font-style:italic">Lihat detail menu</div>`}
      </div>
      <div class="menu-footer">
        <div class="menu-price">${formatRp(m.price)}</div>
        ${isHabis ? `<span class="habis-label">Habis</span>` :

          `<div class="qty-ctrl" onclick="event.stopPropagation()">
            <button class="qty-btn minus" onclick="updateCart('${m.id}',-1)">−</button>
            <span class="qty-num">${qty}</span>
            <button class="qty-btn plus" onclick="updateCart('${m.id}',1)">+</button>
          </div>` :
          `<button class="qty-btn plus" onclick="event.stopPropagation();openItemDetail('${m.id}')" style="width:36px;height:36px;font-size:20px">+</button>`
        }
      </div>
    </div>
  </div>`;
}

function updateCart(id, delta) {
  const m = menuItems.find(x => x.id === id);
  if (!m) return;
  const current = cart[id] || 0;
  const newQty = Math.max(0, Math.min(current + delta, m.stock));
  if (newQty === 0) delete cart[id];
  else cart[id] = newQty;
  renderPage();
}

async function placeOrder() {
  const items = Object.entries(cart).map(([id, qty]) => {
    const m = menuItems.find(x => x.id === id);
    return m ? { menu_item_id: id, name: m.name, price: m.price, quantity: qty, subtotal: m.price * qty } : null;
  }).filter(Boolean);

  if (!items.length) return;

  const btn = document.getElementById('btn-order');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-lg" style="width:20px;height:20px;border-width:2px;display:inline-block;margin-right:8px"></span> Memproses...';

  const subtotal = items.reduce((s, i) => s + i.subtotal, 0);
  const platformFee = PLATFORM_FEE;
  const feeOnCustomer = (restoData.fee_payer !== 'restaurant');
  const total = feeOnCustomer ? subtotal + platformFee : subtotal;
  const customerName = document.getElementById('cust-name').value.trim();
  const customerNote = document.getElementById('cust-note').value.trim();

  // Cari table_id dari meja
  const { data: tableData } = await db.from('restaurant_tables').select('id').eq('restaurant_id', restoData.id).eq('table_number', mejaNum).single();

  // Buat order (subtotal & total dihitung penuh di backend; fee baru ditampilkan ke
  // pelanggan setelah dia memilih metode pembayaran di showPaymentPage)
  const { data: order, error } = await db.from('orders').insert({
    restaurant_id: restoData.id,
    table_id: tableData?.id || null,
    table_number: mejaNum,
    customer_name: customerName || null,
    customer_note: customerNote || null,
    subtotal, platform_fee: platformFee, total,
    status: 'pending',
    payment_status: 'unpaid'
  }).select().single();

  if (error) {
    alert('Gagal membuat pesanan. Coba lagi.');
    btn.disabled = false; btn.innerHTML = `<svg class="i" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 9.8h19"/><path d="M6 14.5h4"/></svg> Lanjut ke Pembayaran &mdash; ${formatRp(subtotal)}`;
    return;
  }

  // Insert order items
  const orderItems = items.map(i => ({ ...i, order_id: order.id }));
  await db.from('order_items').insert(orderItems);

  // Simulasi Xendit Invoice (dalam produksi ganti dengan API Xendit sungguhan)
  // Update order ke payment_status = 'pending_payment' dan simpan invoice url
  await db.from('orders').update({
    payment_status: 'pending_payment',
    xendit_invoice_url: `#simulasi-${order.id}` // Ganti dengan URL Xendit sungguhan
  }).eq('id', order.id);

  // Redirect ke Xendit Payment Page (SIMULASI - dalam produksi gunakan Xendit API)
  showPaymentPage(order, items.length);
}

          <svg class="i" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 9.8h19"/><path d="M6 14.5h4"/></svg> Bayar Sekarang &mdash; ${formatRp(order.total)}
        </button>
        <div style="text-align:center">
          <button onclick="showPaymentPage(pendingOrder, pendingItemCount)" style="background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit">&larr; Ganti metode bayar</button>
        </div>
      </div>
    </div>`;
}

async function simulatePayment(method, orderId) {
  // CATATAN: Ini simulasi. Dalam produksi ganti dengan Xendit Payment API + webhook
  // Xendit akan otomatis kirim webhook ke endpoint kamu saat pembayaran berhasil

  document.getElementById('app').innerHTML = `<div class="result-page"><div class="spinner-lg"></div><p style="color:var(--muted);margin-top:16px">Memproses pembayaran...</p></div>`;

  await new Promise(r => setTimeout(r, 2000));

  // Update status order jadi paid (dalam produksi ini dilakukan oleh webhook Xendit)
  await db.from('orders').update({
    payment_status: 'paid',
    payment_method: method,
    status: 'confirmed',
    paid_at: new Date().toISOString()
  }).eq('id', orderId);

  // Kurangi stok (sudah dilakukan via trigger saat order_items diinsert)
  showSuccess(orderId);
}

async function showSuccess(orderId) {
  const { data: order } = await db.from('orders').select('*,order_items(name,quantity,subtotal)').eq('id', orderId).single();
  if (!order) return;

  cart = {};
  document.getElementById('modal-success').classList.add('active');
  document.getElementById('success-order-num').textContent = `No. Pesanan: ${order.order_number}`;
  document.getElementById('success-detail').innerHTML = `
    ${order.order_items?.map(i => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0">${i.name} x${i.quantity}<span>${formatRp(i.subtotal)}</span></div>`).join('')}
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:15px;padding-top:10px;border-top:1px solid var(--border);margin-top:8px;color:var(--primary)">Total<span>${formatRp(order.total)}</span></div>
  `;
  renderPage();
}

function resetOrder() {
  cart = {};
  document.getElementById('modal-success').classList.remove('active');
  renderPage();
}

init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
