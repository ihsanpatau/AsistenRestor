<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran Berhasil - RestoranKu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#21262F;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:40px 32px;text-align:center;max-width:360px;width:100%}
.icon{width:80px;height:80px;background:rgba(34,197,94,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:36px}
h1{font-size:22px;font-weight:800;margin-bottom:8px}
p{color:rgba(255,255,255,.6);font-size:14px;line-height:1.6;margin-bottom:24px}
.btn{display:block;background:#C2531F;color:#fff;padding:14px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;margin-bottom:10px}
.btn.outline{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>Pembayaran Berhasil!</h1>
  <p>Terima kasih! Pesanan kamu sedang diproses oleh restoran. Silakan tunggu di meja kamu.</p>
  <a href="javascript:history.back()" class="btn outline">← Kembali ke Menu</a>
</div>
</body>
</html>
