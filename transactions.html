<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Transaksi - RestoranKu</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C2531F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RestoranKu">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  .summary-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 16px; margin-bottom: 24px; }
  .summary-box { background: white; border-radius: var(--radius); border: 1px solid var(--border); padding: 18px 20px; }
  .summary-box .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; display: flex; align-items: center; gap: 5px; }
  .summary-box .value { font-size: 20px; font-weight: 800; font-family: 'Plus Jakarta Sans', sans-serif; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="page-title">Transaksi & Laporan</div>
      </div>
      <div class="topbar-right">
        <span class="topbar-resto-name" id="topbar-resto-name"></span>
        <button type="button" class="topbar-avatar-btn" onclick="toggleMoreSheet()" id="topbar-avatar-btn">R</button>
        <button class="btn btn-ghost btn-sm" onclick="exportCSV()"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11.5"/><path d="M7.5 11l4.5 4.5L16.5 11"/><path d="M4.5 19.5h15"/></svg> Export CSV</button>
        <button class="btn btn-primary btn-sm" onclick="exportExcel()"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11.5"/><path d="M7.5 11l4.5 4.5L16.5 11"/><path d="M4.5 19.5h15"/></svg> Export Excel</button>
      </div>
    </div>

    <div class="content">
      <!-- FILTER -->
      <div class="card" style="margin-bottom:20px">
        <div class="card-body" style="padding:16px 20px">
          <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
            <div>
              <label class="form-label" style="margin-bottom:4px">Dari Tanggal</label>
              <input type="date" class="form-control" id="date-from" style="width:auto">
            </div>
            <div>
              <label class="form-label" style="margin-bottom:4px">Sampai Tanggal</label>
              <input type="date" class="form-control" id="date-to" style="width:auto">
            </div>
            <div>
              <label class="form-label" style="margin-bottom:4px">Status</label>
              <select class="form-control" id="filter-pay" style="width:auto">
                <option value="">Semua</option>
                <option value="paid">Lunas</option>
                <option value="unpaid">Belum Bayar</option>
                <option value="failed">Gagal</option>
                <option value="expired">Expired</option>
              </select>
            </div>
            <div style="margin-top:20px">
              <button class="btn btn-primary" onclick="loadTransactions()"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.3" cy="10.3" r="6.3"/><path d="M20 20l-4.3-4.3"/></svg> Cari</button>
            </div>
            <div style="margin-top:20px">
              <button class="btn btn-ghost" onclick="setPreset('today')">Hari Ini</button>
            </div>
            <div style="margin-top:20px">
              <button class="btn btn-ghost" onclick="setPreset('week')">7 Hari</button>
            </div>
            <div style="margin-top:20px">
              <button class="btn btn-ghost" onclick="setPreset('month')">Bulan Ini</button>
            </div>
          </div>
        </div>
      </div>

      <!-- SUMMARY -->
      <div class="summary-row">
        <div class="summary-box">
          <div class="label"><svg class="i" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9h.01M18 15h.01"/></svg> Total Keuntungan</div>
          <div class="value" id="sum-revenue" style="color:var(--success)">Rp 0</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:4px" id="sum-revenue-sub"></div>
        </div>
        <div class="summary-box">
          <div class="label"><svg class="i" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/><path d="M2.5 3h2l2.3 12a2 2 0 0 0 2 1.6h8a2 2 0 0 0 2-1.6L21 8H6.2"/></svg> Total Transaksi</div>
          <div class="value" id="sum-count">0</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:4px" id="sum-count-sub"></div>
        </div>
        <div class="summary-box">
          <div class="label"><svg class="i" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11"/><path d="M12 20V4"/><path d="M20 20v-6.5"/></svg> Rata-rata per Order</div>
          <div class="value" id="sum-avg">Rp 0</div>
        </div>
      </div>

      <!-- TABEL TRANSAKSI -->
      <div class="card">
        <div class="card-header">
          <h3>Riwayat Transaksi</h3>
          <span style="font-size:13px;color:var(--text-muted)" id="result-count">0 transaksi</span>
        </div>
        <div class="card-body" style="padding:0">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>No Order</th>
                  <th>Meja</th>
                  <th>Waktu</th>
                  <th>Item</th>
                  <th>Keuntungan</th>
                  <th>Metode</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="trans-tbody">
                <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">Pilih periode dan klik Cari</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="supabase.js"></script>
<script>
let restoId = null, transData = [];


function setPreset(type) {
  const now = new Date();
  const today = now.toISOString().split('T')[0];
  if (type === 'today') {
    document.getElementById('date-from').value = today;
    document.getElementById('date-to').value = today;
  } else if (type === 'week') {
    const week = new Date(now); week.setDate(now.getDate() - 6);
    document.getElementById('date-from').value = week.toISOString().split('T')[0];
    document.getElementById('date-to').value = today;
  } else if (type === 'month') {
    document.getElementById('date-from').value = today.slice(0,7) + '-01';
    document.getElementById('date-to').value = today;
  }
  loadTransactions();
}

async function init() {
  const user = await Auth.requireAuth();
  document.getElementById('user-email').textContent = user.email;
  const { data: resto } = await db.from('restaurants').select('id,name,logo_url').eq('user_id', user.id).single();
  if (!resto) return;
  applyRestoIdentity(resto);
  restoId = resto.id;
  setPreset('today');
}

async function loadTransactions() {
  const from = document.getElementById('date-from').value;
  const to = document.getElementById('date-to').value;
  const pay = document.getElementById('filter-pay').value;
  if (!from || !to) return showToast('Pilih tanggal dulu', 'error');

  let query = db.from('orders').select('*,order_items(name,quantity)').eq('restaurant_id', restoId).gte('created_at', from).lte('created_at', to + 'T23:59:59').order('created_at', { ascending: false });
  if (pay) query = query.eq('payment_status', pay);

  const { data, error } = await query;
  if (error) return showToast('Gagal memuat data', 'error');
  transData = data || [];
  renderSummary();
  renderTable();
}

function renderSummary() {
  const paid = transData.filter(o => o.payment_status === 'paid');
  const profit = paid.reduce((s, o) => s + keuntungan(o), 0);
  const avg = paid.length ? Math.round(profit / paid.length) : 0;

  document.getElementById('sum-revenue').textContent = formatRupiah(profit);
  document.getElementById('sum-revenue-sub').textContent = `${paid.length} transaksi lunas`;
  document.getElementById('sum-count').textContent = transData.length;
  document.getElementById('sum-count-sub').textContent = `${paid.length} lunas · ${transData.length - paid.length} lainnya`;
  document.getElementById('sum-avg').textContent = formatRupiah(avg);
  document.getElementById('result-count').textContent = `${transData.length} transaksi`;
}

// Keuntungan restoran per order = total dibayar customer dikurangi platform fee
// (kalau kolom subtotal tersedia, itu sudah sama nilainya dan dipakai sebagai fallback).
function keuntungan(o) {
  if (o.subtotal != null) return o.subtotal;
  return (o.total || 0) - (o.platform_fee || 0);
}

function renderTable() {
  const tbody = document.getElementById('trans-tbody');
  const payColor = { paid: 'badge-success', unpaid: 'badge-warning', pending_payment: 'badge-info', failed: 'badge-danger', expired: 'badge-secondary' };
  const payLabel = { paid: 'Lunas', unpaid: 'Belum', pending_payment: 'Proses', failed: 'Gagal', expired: 'Expired' };

  if (!transData.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">Tidak ada transaksi pada periode ini</td></tr>';
    return;
  }

  tbody.innerHTML = transData.map(o => `<tr>
    <td><span style="font-weight:600;font-size:13px">${o.order_number}</span></td>
    <td>Meja ${o.table_number}</td>
    <td style="font-size:12px;color:var(--text-muted);white-space:nowrap">${new Date(o.created_at).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
    <td style="font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.order_items?.map(i=>`${i.name} x${i.quantity}`).join(', ') || '-'}</td>
    <td><strong>${formatRupiah(keuntungan(o))}</strong></td>
    <td style="font-size:12px">${o.payment_method || '-'}</td>
    <td><span class="badge ${payColor[o.payment_status] || 'badge-secondary'}">${payLabel[o.payment_status] || o.payment_status}</span></td>
  </tr>`).join('');
}

// Susun baris data laporan (dipakai bareng oleh Export CSV & Export Excel supaya isinya konsisten)
function buildReportRows() {
  const payLabel = { paid: 'Lunas', unpaid: 'Belum Bayar', pending_payment: 'Diproses', failed: 'Gagal', expired: 'Expired' };
  const headers = ['No Order', 'Meja', 'Waktu', 'Item', 'Keuntungan', 'Metode', 'Status'];
  const rows = transData.map(o => [
    o.order_number,
    `Meja ${o.table_number}`,
    new Date(o.created_at).toLocaleString('id-ID'),
    o.order_items?.map(i => `${i.name} x${i.quantity}`).join(' | ') || '-',
    keuntungan(o),
    o.payment_method || '-',
    payLabel[o.payment_status] || o.payment_status,
  ]);
  return { headers, rows };
}

function exportCSV() {
  if (!transData.length) return showToast('Tidak ada data untuk diexport', 'error');
  const { headers, rows } = buildReportRows();
  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `transaksi-${document.getElementById('date-from').value}_${document.getElementById('date-to').value}.csv`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  showToast('File CSV berhasil didownload', 'success');
}

function exportExcel() {
  if (!transData.length) return showToast('Tidak ada data untuk diexport', 'error');
  if (typeof XLSX === 'undefined') return showToast('Gagal memuat modul Excel, coba refresh halaman', 'error');

  const { headers, rows } = buildReportRows();
  const paid = transData.filter(o => o.payment_status === 'paid');
  const totalKeuntungan = paid.reduce((s, o) => s + keuntungan(o), 0);
  const from = document.getElementById('date-from').value;
  const to = document.getElementById('date-to').value;

  // --- Sheet 1: Ringkasan ---
  const summaryAOA = [
    ['Laporan Transaksi & Keuntungan'],
    ['Restoran', document.getElementById('resto-name-sidebar').textContent],
    ['Periode', `${from} s/d ${to}`],
    ['Dicetak', new Date().toLocaleString('id-ID')],
    [],
    ['Total Transaksi', transData.length],
    ['Transaksi Lunas', paid.length],
    ['Total Keuntungan', totalKeuntungan],
    ['Rata-rata Keuntungan / Order', paid.length ? Math.round(totalKeuntungan / paid.length) : 0],
  ];
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryAOA);
  wsSummary['!cols'] = [{ wch: 26 }, { wch: 30 }];
  wsSummary['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 1 } }];

  // --- Sheet 2: Detail transaksi ---
  const wsDetail = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  wsDetail['!cols'] = [
    { wch: 20 }, { wch: 10 }, { wch: 18 }, { wch: 34 }, { wch: 16 }, { wch: 12 }, { wch: 12 },
  ];
  // Format kolom "Keuntungan" (index 4) sebagai angka Rupiah
  const range = XLSX.utils.decode_range(wsDetail['!ref']);
  for (let r = 1; r <= range.e.r; r++) {
    const cell = wsDetail[XLSX.utils.encode_cell({ r, c: 4 })];
    if (cell) cell.z = '#,##0';
  }
  wsDetail['!autofilter'] = { ref: wsDetail['!ref'] };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Ringkasan');
  XLSX.utils.book_append_sheet(wb, wsDetail, 'Detail Transaksi');
  XLSX.writeFile(wb, `laporan-transaksi-${from}_${to}.xlsx`);
  showToast('File Excel berhasil didownload', 'success');
}

init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>

  <div class="sheet-overlay" id="more-sheet-overlay" onclick="closeMoreSheet(event)">
    <div class="sheet-panel" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-user-row">
        <div class="user-avatar-lg" id="user-avatar">R</div>
        <div>
          <div class="sheet-resto-name" id="resto-name-sidebar">Loading...</div>
          <div class="sheet-user-email" id="user-email">-</div>
        </div>
      </div>
      <a href="transactions.html" class="sheet-link"><svg class="i" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9h.01M18 15h.01"/></svg> Transaksi &amp; Laporan</a>
      <a href="settings.html" class="sheet-link"><svg class="i" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M12 3v2.6M12 18.4V21M21 12h-2.6M5.6 12H3M18.4 5.6l-1.9 1.9M7.5 16.5l-1.9 1.9M18.4 18.4l-1.9-1.9M7.5 7.5 5.6 5.6"/></svg> Pengaturan</a>
      <button type="button" class="sheet-link sheet-logout" onclick="Auth.logout()">↩ Keluar Akun</button>
    </div>
  </div>
</body>
