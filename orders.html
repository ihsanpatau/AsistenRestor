<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pesanan - RestoranKu</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C2531F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RestoranKu">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  .order-columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .order-col { background: var(--bg); border-radius: var(--radius); padding: 16px; min-height: 400px; }
  .order-col-header { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
  .order-col-header .count { background: white; border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .order-card2 { background: white; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; cursor: pointer; transition: all 0.2s; }
  .order-card2:hover { box-shadow: var(--shadow); }
  .order-card2.new { border-color: var(--warning); animation: slideIn 0.4s ease; }
  .order-card2 .oc-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .order-card2 .oc-body { padding: 10px 14px; }
  .order-card2 .oc-footer { padding: 8px 14px; background: var(--bg); display: flex; gap: 6px; }
  .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-tab { padding: 7px 16px; border-radius: 999px; border: 1px solid var(--border); font-size: 13px; cursor: pointer; font-weight: 500; transition: all 0.2s; background: white; display: inline-flex; align-items: center; gap: 6px; }
  .filter-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
</style>
</head>
<body>
<div class="app-shell">
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="page-title">Pesanan Masuk</div>
      </div>
      <div class="topbar-right">
        <span class="topbar-resto-name" id="topbar-resto-name"></span>
        <button type="button" class="topbar-avatar-btn" onclick="toggleMoreSheet()" id="topbar-avatar-btn">R</button>
        <div class="realtime-indicator"><div class="pulse"></div> Realtime</div>
        <div style="display:flex;gap:8px">
          <input type="date" class="form-control" id="filter-date" style="width:auto" onchange="loadOrders()">
          <select class="form-control" id="view-mode" style="width:auto" onchange="toggleView()">
            <option value="kanban">Tampilan Kanban</option>
            <option value="list">Tampilan List</option>
          </select>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="filter-tabs" id="status-tabs">
        <div class="filter-tab active" onclick="filterStatus('',this)">Semua</div>
        <div class="filter-tab" onclick="filterStatus('masuk',this)"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 9.2a5.8 5.8 0 0 1 11.6 0c0 4.8 1.9 5.8 1.9 5.8H4.3s1.9-1 1.9-5.8Z"/><path d="M10.2 18.6a1.9 1.9 0 0 0 3.6 0"/></svg> Pesanan Masuk</div>
        <div class="filter-tab" onclick="filterStatus('completed',this)"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.3 12.5l2.5 2.5L16 9.5"/></svg> Pesanan Selesai</div>
        <div class="filter-tab" onclick="filterStatus('cancelled',this)"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg> Dibatal</div>
      </div>

      <!-- KANBAN VIEW -->
      <div id="kanban-view">
        <div class="order-columns">
          <div class="order-col">
            <div class="order-col-header" style="color:var(--warning)"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 9.2a5.8 5.8 0 0 1 11.6 0c0 4.8 1.9 5.8 1.9 5.8H4.3s1.9-1 1.9-5.8Z"/><path d="M10.2 18.6a1.9 1.9 0 0 0 3.6 0"/></svg> Pesanan Masuk <span class="count" id="cnt-masuk">0</span></div>
            <div id="col-masuk"></div>
          </div>
          <div class="order-col">
            <div class="order-col-header" style="color:var(--success)"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.3 12.5l2.5 2.5L16 9.5"/></svg> Pesanan Selesai <span class="count" id="cnt-completed">0</span></div>
            <div id="col-completed"></div>
          </div>
        </div>
      </div>

      <!-- LIST VIEW -->
      <div id="list-view" style="display:none">
        <div class="card">
          <div class="card-body" style="padding:0">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>No Order</th><th>Meja</th><th>Item</th><th>Total</th><th>Pembayaran</th><th>Status</th><th>Waktu</th><th>Aksi</th>
                  </tr>
                </thead>
                <tbody id="order-table-body">
                  <tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted)">Memuat...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL DETAIL ORDER -->
<div class="modal-overlay" id="modal-order">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <h3 id="detail-order-num">Detail Pesanan</h3>
      <button class="modal-close" onclick="closeOrderModal()"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="modal-body" id="detail-order-body">
    </div>
    <div class="modal-footer" id="detail-order-footer">
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
let restoId = null, allOrders = [], currentStatus = '', channel = null;


// Set default date to today
document.getElementById('filter-date').value = new Date().toISOString().split('T')[0];

async function init() {
  const user = await Auth.requireAuth();
  document.getElementById('user-email').textContent = user.email;
  const { data: resto } = await db.from('restaurants').select('id,name,logo_url').eq('user_id', user.id).single();
  if (!resto) return;
  applyRestoIdentity(resto);
  restoId = resto.id;
  await loadOrders();
  subscribeOrders();
}

async function loadOrders() {
  const date = document.getElementById('filter-date').value;
  const { data } = await db.from('orders').select('*,order_items(id,name,price,quantity,subtotal,note)').eq('restaurant_id', restoId).gte('created_at', date).lte('created_at', date + 'T23:59:59').order('created_at', { ascending: false });
  allOrders = data || [];
  renderAll();
}

function filterStatus(status, el) {
  currentStatus = status;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}

function renderAll() {
  const filtered = currentStatus ? allOrders.filter(o => simpleStatus(o.status) === currentStatus) : allOrders;
  const viewMode = document.getElementById('view-mode').value;
  if (viewMode === 'kanban') renderKanban(filtered);
  else renderList(filtered);
}

function toggleView() { renderAll(); }

// Status pesanan disederhanakan jadi 2 tahap: "masuk" (baru masuk / lagi diproses dapur) dan "completed" (sudah selesai).
// "cancelled" tetap ada sebagai aksi terpisah untuk pesanan yang dibatalkan.
function simpleStatus(status) {
  if (status === 'completed') return 'completed';
  if (status === 'cancelled') return 'cancelled';
  return 'masuk'; // pending, confirmed, preparing, ready (data lama) semua dianggap "masuk"
}
const simpleLabel = { masuk: 'Pesanan Masuk', completed: 'Selesai', cancelled: 'Dibatal' };
const simpleColor = { masuk: 'badge-warning', completed: 'badge-success', cancelled: 'badge-danger' };
const payColor = { paid: 'badge-success', unpaid: 'badge-warning', pending_payment: 'badge-info', failed: 'badge-danger', expired: 'badge-secondary' };
const payLabel = { paid: 'Lunas', unpaid: 'Belum Bayar', pending_payment: 'Memproses', failed: 'Gagal', expired: 'Expired' };
// Alias supaya kompatibel di tempat yang masih memakai nama lama
const statusLabel = simpleLabel, statusColor = simpleColor;

function orderCard(o) {
  const items = o.order_items || [];
  const st = simpleStatus(o.status);

  return `<div class="order-card2" onclick="showDetail('${o.id}')">
    <div class="oc-header">
      <div>
        <div style="font-weight:700;font-size:13px">${o.order_number}</div>
        <div style="font-size:12px;color:var(--text-muted)"><svg class="i" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="3" rx="1"/><path d="M5.5 10.5V20"/><path d="M18.5 10.5V20"/></svg> Meja ${o.table_number} ${o.customer_name ? '&middot; ' + o.customer_name : ''}</div>
      </div>
      <span class="badge ${payColor[o.payment_status] || 'badge-secondary'}">${payLabel[o.payment_status] || o.payment_status}</span>
    </div>
    <div class="oc-body">
      ${items.slice(0,3).map(i => `<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0">
        <span>${i.name} x${i.quantity}</span>
        <span style="color:var(--text-muted)">${formatRupiah(i.subtotal)}</span>
      </div>`).join('')}
      ${items.length > 3 ? `<div style="font-size:11px;color:var(--text-muted)">+${items.length - 3} item lainnya</div>` : ''}
      <div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
        <span style="font-size:12px;color:var(--text-muted)">${new Date(o.created_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</span>
        <span style="font-weight:700;font-size:14px;color:var(--primary)">${formatRupiah(o.total)}</span>
      </div>
      ${o.customer_note ? `<div style="font-size:11px;background:var(--warning-light);padding:6px 8px;border-radius:4px;margin-top:6px;color:#744210;display:flex;gap:5px;align-items:flex-start"><svg class="i" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 2.5h8.6l4.2 4.2v14.8H6.2Z"/><path d="M9 12h6M9 15.4h6M9 8.5h2.6"/></svg> <span>${o.customer_note}</span></div>` : ''}
    </div>
    ${st === 'masuk' ? `<div class="oc-footer" onclick="event.stopPropagation()">
      <button class="btn btn-primary btn-sm btn-block" onclick="updateStatus('${o.id}','completed')"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.3 4.3L19 7"/></svg> Konfirmasi Selesai</button>
      <button class="btn btn-sm" style="background:var(--danger-light);color:var(--danger);border:none" onclick="updateStatus('${o.id}','cancelled')">Batalkan</button>
    </div>` : ''}
  </div>`;
}

function renderKanban(orders) {
  document.getElementById('kanban-view').style.display = 'block';
  document.getElementById('list-view').style.display = 'none';
  const cols = { masuk: [], completed: [] };
  orders.forEach(o => {
    const st = simpleStatus(o.status);
    if (st === 'masuk') cols.masuk.unshift(o);
    else if (st === 'completed') cols.completed.unshift(o);
    // cancelled tidak ditampilkan di kanban, cek lewat tab "Dibatal" / tampilan list
  });

  document.getElementById('cnt-masuk').textContent = cols.masuk.length;
  document.getElementById('cnt-completed').textContent = cols.completed.length;

  document.getElementById('col-masuk').innerHTML = cols.masuk.length ? cols.masuk.map(o => orderCard(o)).join('') : '<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px">Tidak ada pesanan</div>';
  document.getElementById('col-completed').innerHTML = cols.completed.length ? cols.completed.map(o => orderCard(o)).join('') : '<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px">Tidak ada</div>';
}

function renderList(orders) {
  document.getElementById('kanban-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
  const tbody = document.getElementById('order-table-body');
  if (!orders.length) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted)">Tidak ada pesanan</td></tr>'; return; }
  tbody.innerHTML = orders.map(o => `<tr>
    <td><span style="font-weight:600;font-size:13px">${o.order_number}</span></td>
    <td>Meja ${o.table_number}</td>
    <td style="font-size:12px">${o.order_items?.map(i=>`${i.name} x${i.quantity}`).join(', ') || '-'}</td>
    <td><strong>${formatRupiah(o.total)}</strong></td>
    <td><span class="badge ${payColor[o.payment_status] || 'badge-secondary'}">${payLabel[o.payment_status] || o.payment_status}</span></td>
    <td><span class="badge ${simpleColor[simpleStatus(o.status)]}">${simpleLabel[simpleStatus(o.status)]}</span></td>
    <td style="font-size:12px;color:var(--text-muted)">${new Date(o.created_at).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
    <td><button class="btn btn-ghost btn-sm" onclick="showDetail('${o.id}')">Detail</button></td>
  </tr>`).join('');
}

async function updateStatus(orderId, newStatus) {
  const { error } = await db.from('orders').update({ status: newStatus, ...(newStatus === 'completed' ? { completed_at: new Date().toISOString() } : {}) }).eq('id', orderId).eq('restaurant_id', restoId);
  if (error) return showToast('Gagal update status', 'error');
  showToast(`Status diupdate ke: ${statusLabel[newStatus]}`, 'success');
  await loadOrders();
}

function showDetail(orderId) {
  const o = allOrders.find(x => x.id === orderId);
  if (!o) return;
  const items = o.order_items || [];
  document.getElementById('detail-order-num').textContent = o.order_number;
  document.getElementById('detail-order-body').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
      <div style="background:var(--bg);padding:12px;border-radius:var(--radius-sm)">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">MEJA</div>
        <div style="font-weight:700">Meja ${o.table_number}</div>
      </div>
      <div style="background:var(--bg);padding:12px;border-radius:var(--radius-sm)">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">WAKTU</div>
        <div style="font-weight:600;font-size:13px">${new Date(o.created_at).toLocaleString('id-ID')}</div>
      </div>
      <div style="background:var(--bg);padding:12px;border-radius:var(--radius-sm)">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">STATUS BAYAR</div>
        <span class="badge ${payColor[o.payment_status] || 'badge-secondary'}">${payLabel[o.payment_status] || o.payment_status}</span>
      </div>
      <div style="background:var(--bg);padding:12px;border-radius:var(--radius-sm)">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">STATUS PESANAN</div>
        <span class="badge ${simpleColor[simpleStatus(o.status)]}">${simpleLabel[simpleStatus(o.status)]}</span>
      </div>
    </div>
    ${o.customer_name ? `<p style="margin-bottom:12px"><strong>Pelanggan:</strong> ${o.customer_name}</p>` : ''}
    ${o.customer_note ? `<div class="alert alert-warning" style="margin-bottom:16px"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 2.5h8.6l4.2 4.2v14.8H6.2Z"/><path d="M9 12h6M9 15.4h6M9 8.5h2.6"/></svg> <strong>Catatan:</strong> ${o.customer_note}</div>` : ''}
    <div style="background:var(--bg);border-radius:var(--radius-sm);overflow:hidden">
      ${items.map(i => `<div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)">
        <div><div style="font-weight:500">${i.name}</div>${i.note ? `<div style="font-size:11px;color:var(--text-muted)">${i.note}</div>` : ''}</div>
        <div style="text-align:right">
          <div style="font-size:12px;color:var(--text-muted)">x${i.quantity} × ${formatRupiah(i.price)}</div>
          <div style="font-weight:600">${formatRupiah(i.subtotal)}</div>
        </div>
      </div>`).join('')}
      <div style="display:flex;justify-content:space-between;padding:12px 14px">
        <span style="color:var(--text-muted);font-size:13px">Subtotal</span>
        <span>${formatRupiah(o.subtotal)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--border)">
        <span style="color:var(--text-muted);font-size:13px">Platform Fee</span>
        <span style="color:var(--text-muted)">${formatRupiah(o.platform_fee || 0)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:12px 14px;border-top:2px solid var(--border);background:white">
        <span style="font-weight:700">Total</span>
        <span style="font-weight:700;font-size:18px;color:var(--primary)">${formatRupiah(o.total)}</span>
      </div>
    </div>
  `;

  const footer = document.getElementById('detail-order-footer');
  const st = simpleStatus(o.status);
  footer.innerHTML = `<button class="btn btn-ghost" onclick="closeOrderModal()">Tutup</button>
    ${st === 'masuk' ? `<button class="btn btn-primary" onclick="updateStatus('${o.id}','completed');closeOrderModal()"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.3 4.3L19 7"/></svg> Konfirmasi Selesai</button>
    <button class="btn btn-danger" onclick="updateStatus('${o.id}','cancelled');closeOrderModal()">Batalkan</button>` : ''}`;

  document.getElementById('modal-order').classList.add('active');
}

function closeOrderModal() { document.getElementById('modal-order').classList.remove('active'); }

function subscribeOrders() {
  channel = db.channel('orders-realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'orders', filter: `restaurant_id=eq.${restoId}` }, async (payload) => {
    if (payload.eventType === 'INSERT') {
      showToast(`Pesanan baru masuk! Meja ${payload.new.table_number}`, 'info');
      // Play notification sound
      try { const ctx = new AudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.frequency.setValueAtTime(880, ctx.currentTime); gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3); osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3); } catch(e) {}
    }
    await loadOrders();
  }).subscribe();
}

init();
</script>
  <nav class="bottom-nav">

    <a href="orders.html" class="bottom-nav-item active"><span class="bn-icon"><svg class="i" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/><path d="M2.5 3h2l2.3 12a2 2 0 0 0 2 1.6h8a2 2 0 0 0 2-1.6L21 8H6.2"/></svg></span>Pesanan</a>

    <a href="tables.html" class="bottom-nav-item"><span class="bn-icon"><svg class="i" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="3" rx="1"/><path d="M5.5 10.5V20"/><path d="M18.5 10.5V20"/></svg></span>Meja</a>

  <div class="sheet-overlay" id="more-sheet-overlay" onclick="closeMoreSheet(event)">
    <div class="sheet-panel" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-user-row">
        <div class="user-avatar-lg" id="user-avatar">R</div>
        <div>
          <div class="sheet-resto-name" id="resto-name-sidebar">Loading...</div>
          <div class="sheet-user-email" id="user-email">-</div>
